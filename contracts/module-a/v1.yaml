# 记账 API —— 账目域契约。字段与语义变更走 contracts/module-a/proposals/。
contract:
  name: LedgerService
  module: module-a
  version: v1
  status: approved
  owner: worker-module-a
  consumers: [worker-module-b]   # module-b 的报表通过本契约取数
  stability: stable

methods:
  - name: create_account
    kind: request_response
    input:
      name: { type: string, required: true }
      currency: { type: string, required: true, format: iso4217 }
    output:
      account: { type: object, required: true, ref: Account }
    errors: [INVALID_CURRENCY, DUPLICATE_ACCOUNT_NAME]
    idempotent: false
    side_effects: creates_account

  - name: record_entry
    kind: request_response
    # amount 为最小货币单位正整数（如分），不支持小数金额
    input:
      account_id: { type: string, required: true, format: uuid }
      amount: { type: integer, required: true }
      kind: { type: string, required: true, enum: [income, expense] }
      occurred_on: { type: string, required: true, format: date }
      category: { type: string, required: false }
      memo: { type: string, required: false }
    output:
      entry: { type: object, required: true, ref: Entry }
    errors: [ACCOUNT_NOT_FOUND, INVALID_AMOUNT, INVALID_CATEGORY]
    idempotent: false
    side_effects: creates_entry
    semantics:
      amount: "最小货币单位正整数；<= 0、非整数、bool 均 INVALID_AMOUNT"
      category_default: "未提供时 Entry.category 输出空字符串"
      category_normalization: "去首尾空白；去空白后为空、超 64 字符或含控制字符 → INVALID_CATEGORY"
      memo_default: "未提供时 Entry.memo 输出空字符串"
      memo_normalization: "提供时去首尾空白后保存"
      date_input: "YYYY-MM-DD（严格形态：长度 10、第 5/8 位为 -）或 datetime.date；其他形态 → ValueError"
      precondition_violation: "kind 不是 income|expense → ValueError"

  - name: get_balance
    kind: request_response
    input:
      account_id: { type: string, required: true, format: uuid }
      as_of: { type: string, required: false, format: date }
    output:
      balance: { type: object, required: true, ref: Balance }
    errors: [ACCOUNT_NOT_FOUND]
    idempotent: true
    side_effects: none
    semantics:
      as_of: "含当天：只累计 occurred_on <= as_of 的流水；as_of 未提供时累计全部"
      amount: "有符号：income 合计 - expense 合计"
      date_input: "YYYY-MM-DD（严格形态：长度 10、第 5/8 位为 -）或 datetime.date；其他形态 → ValueError"

  - name: list_entries
    kind: request_response
    input:
      account_id: { type: string, required: true, format: uuid }
      from: { type: string, required: false, format: date }
      to: { type: string, required: false, format: date }
      limit: { type: integer, required: false }
    output:
      entries: { type: array, required: true, ref: Entry }
    errors: [ACCOUNT_NOT_FOUND, INVALID_DATE_RANGE]
    idempotent: true
    side_effects: none
    semantics:
      range: "闭区间：from <= occurred_on <= to；任一端可省略，两端都可省略时返回全部"
      order: "按 occurred_on 升序；同一日期内保持写入（创建）顺序，排序必须稳定"
      limit: "在上述排序之后取前 N 条；提供时必须为正整数，否则 ValueError"
      date_input: "YYYY-MM-DD（严格形态：长度 10、第 5/8 位为 -）或 datetime.date；其他形态 → ValueError"

types:
  Account:
    id: { type: string, format: uuid }
    name: { type: string }
    currency: { type: string }
    created_at: { type: string, format: date-time }
  Entry:
    id: { type: string, format: uuid }
    account_id: { type: string, format: uuid }
    amount: { type: integer }
    kind: { type: string, enum: [income, expense] }
    occurred_on: { type: string, format: date }
    category: { type: string }   # 缺省 ""；归一化规则见 record_entry.semantics
    memo: { type: string }       # 缺省 ""；提供时去首尾空白
    created_at: { type: string, format: date-time }
  Balance:
    account_id: { type: string, format: uuid }
    currency: { type: string }
    amount: { type: integer }   # 有符号：income - expense

error_codes:
  INVALID_CURRENCY: { http: 400, retryable: false }
  DUPLICATE_ACCOUNT_NAME: { http: 409, retryable: false }
  ACCOUNT_NOT_FOUND: { http: 404, retryable: false }
  INVALID_AMOUNT: { http: 400, retryable: false }     # <= 0 或非整数
  INVALID_CATEGORY: { http: 400, retryable: false }
  INVALID_DATE_RANGE: { http: 400, retryable: false } # from > to

versioning:
  strategy: semver_method
  deprecation_window: 1_release

# 下游接入方式由本块唯一决定（提案 proposals/20261127-entrypoint.md，方案 A）。
# factory 必须写成 <import 名>:<类名>，不允许下游猜模块名。
implementation:
  module_path: modules/module-a        # 相对仓库根
  factory: "ledger:LedgerService"      # <import 名>:<类名>
  bootstrap: sys_path                  # 调用方需把 module_path 加入 sys.path

mocks:
  path: contracts/module-a/mocks/ledger_service.py

contract_tests:
  command: uv run pytest tests/contracts/module-a